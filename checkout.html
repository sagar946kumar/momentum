<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Order | Momentum</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">
    <!-- SDKs -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        :root {
            --primary: #4A7CFF;
            --primary-dark: #3563E9;
            --accent: #00D2A0;
            --bg: #0A0C14;
            --card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #FFFFFF;
            --text-dim: #9CA3B4;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            justify-content: center;
            align-items: center;
        }

        .checkout-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .action-card {
            background: var(--card);
            backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            position: relative;
        }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            color: var(--primary);
        }

        .price-display {
            margin-bottom: 40px;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .currency {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-dim);
        }

        .price {
            font-size: 3.5rem;
            font-family: 'Outfit';
            font-weight: 800;
        }

        .label-text {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        /* --- Stepper UI --- */
        .step-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .step {
            display: none;
            animation: slideIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .step.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .step-num {
            width: 24px;
            height: 24px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 800;
        }

        .step-title {
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* --- Components --- */
        .btn-full {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-google {
            background: white;
            color: #1F2937;
            margin-bottom: 20px;
        }

        .btn-google:hover {
            background: #F9FAFB;
            transform: translateY(-2px);
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .input-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            color: white;
            font-size: 1.1rem;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-pay {
            background: linear-gradient(135deg, #4A7CFF 0%, #00D2A0 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(74, 124, 255, 0.3);
        }

        .btn-pay:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(74, 124, 255, 0.4);
        }

        .user-preview {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--primary);
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .u-name {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .u-email {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .back-link:hover {
            color: white;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="checkout-container">
        <div class="action-card">
            <div class="logo">
                <span class="logo-icon">✦</span>
                <span>Momentum</span>
            </div>

            <div class="price-display">
                <div class="price-row">
                    <span class="currency">₹</span>
                    <span class="price">199</span>
                    <span class="period">LIFETIME</span>
                </div>
                <div class="label-text">Full access to Dreams & Momentum Dashboard</div>
            </div>

            <!-- STEP 1: GMAIL AUTH -->
            <div id="step-auth" class="step active">
                <div class="step-header">
                    <div class="step-num">1</div>
                    <span class="step-title">Gmail Authentication</span>
                </div>
                <p style="color: var(--text-dim); font-size: 0.9rem; margin-bottom: 24px;">Sign in with your Google
                    account to get started.</p>
                <button class="btn-full btn-google" id="btn-google">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
                    Continue with Google
                </button>
            </div>

            <!-- STEP 2: MOBILE INFO -->
            <div id="step-details" class="step">
                <div class="user-preview">
                    <img id="u-pfp" src="" class="avatar">
                    <div class="user-info">
                        <span id="u-name" class="u-name"></span>
                        <span id="u-email" class="u-email"></span>
                    </div>
                </div>
                <div class="step-header">
                    <div class="step-num">2</div>
                    <span class="step-title">Mobile Login</span>
                </div>
                <div class="input-group">
                    <label class="input-label">WhatsApp / Mobile Number</label>
                    <input type="tel" id="mobile-input" class="input-field" placeholder="+91 00000 00000">
                </div>
                <button class="btn-full btn-pay" id="btn-to-payment">Go to Payment</button>
                <a class="back-link" id="btn-logout">Sign out</a>
            </div>

            <!-- STEP 3: FINAL PAYMENT -->
            <div id="step-pay" class="step">
                <div class="step-header">
                    <div class="step-num">3</div>
                    <span class="step-title">Razorpay Secure Payment</span>
                </div>
                <div
                    style="background: rgba(0, 210, 160, 0.1); color: var(--accent); padding: 12px; border-radius: 12px; font-size: 0.85rem; margin-bottom: 24px; font-weight: 600;">
                    ✓ Account verified: <span id="verify-phone"></span>
                </div>

                <div class="input-group" style="margin-bottom: 24px;">
                    <label class="input-label">Have a Referral Code? (Optional)</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="referral-input" class="input-field" placeholder="ENTER CODE"
                            style="text-transform: uppercase; margin-bottom: 0;">
                        <button class="btn-pay" id="btn-redeem"
                            style="width: 100px; padding: 10px; font-size: 0.85rem;">Redeem</button>
                    </div>
                    <div id="referral-msg"
                        style="margin-top: 10px; font-size: 0.8rem; font-weight: 600; display: none;">
                    </div>
                </div>

                <div id="payment-area">
                    <button class="btn-full btn-pay" id="btn-razorpay">
                        Pay ₹199 Now
                    </button>
                    <a class="back-link" id="btn-back-step2">Change Number</a>
                </div>

                <div id="success-area" class="hidden">
                    <div
                        style="background: rgba(0, 210, 160, 0.1); color: var(--accent); padding: 16px; border-radius: 16px; border: 1px solid var(--accent); margin-bottom: 24px;">
                        <div style="font-weight: 800; font-size: 1rem; margin-bottom: 4px;">🎯 Code Applied!</div>
                        <div style="font-size: 0.85rem; opacity: 0.9;">Your Lifetime Premium account is ready.</div>
                    </div>
                    <button class="btn-full btn-pay" id="btn-enter-premium">
                        Go to Your Dashboard
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from '@supabase/supabase-js';

        const SUPABASE_URL = import.meta.env.VITE_SUPABASE_URL;
        const SUPABASE_ANON_KEY = import.meta.env.VITE_SUPABASE_ANON_KEY;
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const $ = s => document.querySelector(s);
        let user = JSON.parse(localStorage.getItem('user'));

        function showStep(id) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            $(id).classList.add('active');
        }

        async function init() {
            // Initial check for existing session
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                user = {
                    name: session.user.user_metadata.full_name,
                    email: session.user.email,
                    picture: session.user.user_metadata.avatar_url,
                    isLoggedIn: true,
                    phone: user?.phone || ''
                };
                localStorage.setItem('user', JSON.stringify(user));
            }

            if (!user || !user.isLoggedIn) {
                showStep('#step-auth');
            } else if (!user.phone) {
                $('#u-pfp').src = user.picture;
                $('#u-name').textContent = user.name;
                $('#u-email').textContent = user.email;
                showStep('#step-details');
            } else {
                $('#verify-phone').textContent = user.phone;
                showStep('#step-pay');
            }
        }

        init();

        // Step 1: Gmail
        $('#btn-google').addEventListener('click', async () => {
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.href }
            });
            if (error) alert(error.message);
        });

        // Step 2: Mobile
        $('#btn-to-payment').addEventListener('click', () => {
            const phone = $('#mobile-input').value.trim();
            if (phone.length < 10) return alert("Enter a valid mobile number");
            user.phone = phone;
            localStorage.setItem('user', JSON.stringify(user));
            $('#verify-phone').textContent = phone;
            showStep('#step-pay');
        });

        // Step 3: Payment
        $('#btn-redeem').addEventListener('click', () => {
            const code = $('#referral-input').value.trim().toUpperCase();
            const msg = $('#referral-msg');
            msg.style.display = 'block';

            if (code === '25KCRORE') {
                msg.textContent = '✓ Referral code accepted!';
                msg.style.color = 'var(--accent)';
                $('#payment-area').style.display = 'none';
                $('#success-area').classList.remove('hidden');
            } else {
                msg.textContent = '✗ Invalid referral code';
                msg.style.color = '#EF4444';
            }
        });

        async function syncPremiumToSupabase() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                await supabase
                    .from('user_data')
                    .upsert({
                        id: session.user.id,
                        is_premium: true,
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'id' });
                console.log("Premium status synced to cloud.");
            }
        }

        $('#btn-enter-premium').addEventListener('click', async () => {
            user.isPremium = true;
            localStorage.setItem('user', JSON.stringify(user));
            await syncPremiumToSupabase();
            window.location.href = 'index.html';
        });

        $('#btn-razorpay').addEventListener('click', async () => {
            const referralCode = $('#referral-input').value.trim().toUpperCase();
            if (referralCode === '25KCRORE') {
                user.isPremium = true;
                localStorage.setItem('user', JSON.stringify(user));
                await syncPremiumToSupabase();
                window.location.href = 'index.html';
                return;
            }

            const options = {
                "key": "rzp_live_SLR8h7buAJQFlF",
                "amount": "19900",
                "currency": "INR",
                "name": "Momentum",
                "description": "Lifetime Momentum Pass",
                "handler": async function (response) {
                    user.isPremium = true;
                    localStorage.setItem('user', JSON.stringify(user));
                    await syncPremiumToSupabase();
                    alert("Welcome to Momentum Premium!");
                    window.location.href = 'index.html';
                },
                "prefill": {
                    "name": user.name,
                    "email": user.email,
                    "contact": user.phone
                },
                "theme": { "color": "#4A7CFF" }
            };
            const rzp = new Razorpay(options);
            rzp.open();
        });

        $('#btn-logout').addEventListener('click', async () => {
            await supabase.auth.signOut();
            localStorage.removeItem('user');
            window.location.reload();
        });

        $('#btn-back-step2').addEventListener('click', () => showStep('#step-details'));

    </script>
</body>

</html>
